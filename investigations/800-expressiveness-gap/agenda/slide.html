<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Agenda</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
        color: #f1f5f9;
        background: #0b1220;
      }
      .slide {
        position: relative;
        width: 1280px;
        height: 720px;
        background: linear-gradient(135deg, #0b1220 0%, #1a1f3a 100%);
        padding: 80px 96px;
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 80px;
        align-items: start;
      }
      .left {
        padding-top: 24px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #38bdf8;
        font-weight: 600;
      }
      h1 {
        margin-top: 16px;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }
      h1 .accent {
        background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .helper {
        margin-top: 24px;
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
      }
      ol {
        list-style: none;
      }
      ol li {
        display: grid;
        grid-template-columns: 56px 1fr;
        column-gap: 24px;
        padding: 20px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        align-items: baseline;
      }
      ol li:last-child {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      ol li .num {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      ol li .title {
        font-size: 22px;
        font-weight: 600;
        color: #f1f5f9;
      }
      ol li .title small {
        display: block;
        font-size: 13px;
        color: #94a3b8;
        font-weight: 400;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="left">
        <div class="eyebrow">SECTION 01</div>
        <h1>本日の<br /><span class="accent">アジェンダ</span></h1>
        <p class="helper">
          経営チーム向け Q3 レビュー。<br />5 セクション、10 分。
        </p>
      </div>
      <ol>
        <li>
          <span class="num">01</span
          ><span class="title"
            >マーケット概況<small>競合環境とユーザー需要</small></span
          >
        </li>
        <li>
          <span class="num">02</span
          ><span class="title"
            >Q3 主要指標<small>MRR / Active Users / NRR / Churn</small></span
          >
        </li>
        <li>
          <span class="num">03</span
          ><span class="title"
            >プロダクト施策レビュー<small
              >出荷した機能 / 撤退した実験</small
            ></span
          >
        </li>
        <li>
          <span class="num">04</span
          ><span class="title"
            >Q4 マイルストーン<small
              >4 つのマイルストーンと依存関係</small
            ></span
          >
        </li>
        <li>
          <span class="num">05</span
          ><span class="title"
            >意思決定したいこと<small>予算と採用ロードマップの承認</small></span
          >
        </li>
      </ol>
    </div>
  </body>
</html>
