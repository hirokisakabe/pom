<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Title — Q3 Product Review</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
        color: #f1f5f9;
        background: #0b1220;
      }
      .slide {
        position: relative;
        width: 1280px;
        height: 720px;
        background:
          radial-gradient(
            ellipse at top right,
            rgba(167, 139, 250, 0.35),
            transparent 55%
          ),
          radial-gradient(
            ellipse at bottom left,
            rgba(56, 189, 248, 0.25),
            transparent 50%
          ),
          linear-gradient(135deg, #0b1220 0%, #1a1f3a 100%);
        overflow: hidden;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size: 80px 80px;
        mask-image: radial-gradient(
          ellipse at center,
          black 30%,
          transparent 70%
        );
      }
      .badge {
        position: absolute;
        top: 64px;
        left: 64px;
        display: inline-flex;
        gap: 12px;
        align-items: center;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #38bdf8;
        backdrop-filter: blur(8px);
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #38bdf8;
        box-shadow: 0 0 12px #38bdf8;
      }
      .content {
        position: absolute;
        left: 64px;
        bottom: 96px;
        max-width: 880px;
      }
      h1 {
        font-size: 84px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 .accent {
        background: linear-gradient(135deg, #38bdf8 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        margin-top: 32px;
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 18px;
        color: #94a3b8;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      .sub .sep {
        width: 32px;
        height: 1px;
        background: #94a3b8;
      }
      .corner {
        position: absolute;
        bottom: 32px;
        right: 64px;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #64748b;
      }
      .glow-ring {
        position: absolute;
        top: -200px;
        right: -200px;
        width: 600px;
        height: 600px;
        border-radius: 999px;
        border: 1px solid rgba(167, 139, 250, 0.18);
        box-shadow:
          0 0 60px rgba(167, 139, 250, 0.1),
          inset 0 0 60px rgba(167, 139, 250, 0.05);
      }
      .accent-bar {
        position: absolute;
        left: 64px;
        bottom: 200px;
        width: 72px;
        height: 4px;
        background: linear-gradient(90deg, #38bdf8, #a78bfa);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <div class="grid"></div>
      <div class="glow-ring"></div>
      <div class="badge">
        <span class="dot"></span>
        FY2026 / Q3 REVIEW
      </div>
      <div class="accent-bar"></div>
      <div class="content">
        <h1>
          Cosmo<br />
          <span class="accent">Quarterly Review.</span>
        </h1>
        <div class="sub">
          <span>Product · Growth · Roadmap</span>
          <span class="sep"></span>
          <span>2026-06-14 · Yamada T.</span>
        </div>
      </div>
      <div class="corner">© Cosmo Inc. / Confidential</div>
    </div>
  </body>
</html>
