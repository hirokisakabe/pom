<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Timeline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
        color: #f1f5f9;
        background: #0b1220;
      }
      .slide {
        width: 1280px;
        height: 720px;
        background: linear-gradient(135deg, #0b1220 0%, #1a1f3a 100%);
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #38bdf8;
        font-weight: 600;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .tl {
        position: relative;
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0;
        padding-top: 40px;
      }
      .tl::before {
        content: "";
        position: absolute;
        left: 12.5%;
        right: 12.5%;
        top: 120px;
        height: 2px;
        background: linear-gradient(90deg, #38bdf8 0%, #a78bfa 100%);
      }
      .step {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 0 16px;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #0b1220;
        border: 2px solid var(--color);
        box-shadow:
          0 0 16px var(--color),
          inset 0 0 0 4px var(--color);
        position: relative;
        z-index: 2;
        margin-top: 76px;
      }
      .step.s1 {
        --color: #38bdf8;
      }
      .step.s2 {
        --color: #6dc1f0;
      }
      .step.s3 {
        --color: #9099e8;
      }
      .step.s4 {
        --color: #a78bfa;
      }
      .date {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color);
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        color: #f1f5f9;
        text-align: center;
      }
      .desc {
        font-size: 13px;
        color: #94a3b8;
        text-align: center;
        line-height: 1.5;
        max-width: 240px;
      }
      .badge {
        margin-top: 8px;
        font-size: 10px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--color);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }
      footer {
        margin-top: auto;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <header>
        <span class="eyebrow">SECTION 04 · ROADMAP</span>
        <h1>Q4 マイルストーン</h1>
      </header>
      <div class="tl">
        <div class="step s1">
          <div class="dot"></div>
          <div class="date">10 / Week 1</div>
          <div class="title">α 版リリース</div>
          <div class="desc">
            社内 dogfood 開始。<br />主要ユースケースの動作確認。
          </div>
          <div class="badge">M1</div>
        </div>
        <div class="step s2">
          <div class="dot"></div>
          <div class="date">10 / Week 4</div>
          <div class="title">β 招待プログラム</div>
          <div class="desc">
            外部顧客 30 社へ招待。<br />フィードバックループの確立。
          </div>
          <div class="badge">M2</div>
        </div>
        <div class="step s3">
          <div class="dot"></div>
          <div class="date">11 / Week 3</div>
          <div class="title">価格モデル確定</div>
          <div class="desc">使用量ベース vs. シート制を A/B テスト。</div>
          <div class="badge">M3</div>
        </div>
        <div class="step s4">
          <div class="dot"></div>
          <div class="date">12 / Week 2</div>
          <div class="title">GA リリース</div>
          <div class="desc">
            全機能解放 + ローンチイベント。<br />媒体露出 3 件確保。
          </div>
          <div class="badge">M4</div>
        </div>
      </div>
      <footer>SOURCE: PRODUCT ROADMAP — FY2026 Q4</footer>
    </div>
  </body>
</html>
