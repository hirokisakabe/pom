<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>KPI Dashboard — Q3 Product Review</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
        color: #f1f5f9;
        background: #0b1220;
      }
      .slide {
        position: relative;
        width: 1280px;
        height: 720px;
        background:
          radial-gradient(
            ellipse at top right,
            rgba(167, 139, 250, 0.18),
            transparent 55%
          ),
          linear-gradient(135deg, #0b1220 0%, #1a1f3a 100%);
        padding: 64px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #38bdf8;
        font-weight: 600;
      }
      .eyebrow::before {
        content: "";
        width: 24px;
        height: 1px;
        background: #38bdf8;
      }
      h1 {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f1f5f9;
      }
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
      }
      .tile {
        position: relative;
        padding: 28px;
        background: rgba(17, 27, 46, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
      }
      .tile::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
      }
      .tile.t1 {
        --accent: #38bdf8;
      }
      .tile.t2 {
        --accent: #a78bfa;
      }
      .tile.t3 {
        --accent: #34d399;
      }
      .tile.t4 {
        --accent: #f87171;
      }
      .tile .label {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #94a3b8;
        font-weight: 500;
      }
      .tile .number {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.05;
        margin-top: 16px;
        background: linear-gradient(135deg, var(--accent) 0%, #f1f5f9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tile .unit {
        font-size: 18px;
        font-weight: 600;
        color: #94a3b8;
        margin-left: 4px;
        -webkit-text-fill-color: #94a3b8;
      }
      .tile .change {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        margin-top: 16px;
        width: fit-content;
      }
      .tile .change.up {
        color: #34d399;
        background: rgba(52, 211, 153, 0.12);
      }
      .tile .change.down {
        color: #f87171;
        background: rgba(248, 113, 113, 0.12);
      }
      .tile .spark {
        margin-top: 18px;
        height: 32px;
        display: flex;
        align-items: flex-end;
        gap: 4px;
      }
      .tile .spark span {
        flex: 1;
        background: linear-gradient(
          180deg,
          var(--accent) 0%,
          rgba(56, 189, 248, 0.2) 100%
        );
        border-radius: 2px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="slide">
      <header>
        <span class="eyebrow">Section 02 · Performance</span>
        <h1>Q3 主要指標 ハイライト</h1>
      </header>

      <div class="grid">
        <div class="tile t1">
          <div>
            <div class="label">MRR</div>
            <div class="number">¥84.2<span class="unit">M</span></div>
          </div>
          <div>
            <div class="change up">▲ +12.4% QoQ</div>
            <div class="spark">
              <span style="height: 30%"></span>
              <span style="height: 45%"></span>
              <span style="height: 55%"></span>
              <span style="height: 70%"></span>
              <span style="height: 80%"></span>
              <span style="height: 100%"></span>
            </div>
          </div>
        </div>

        <div class="tile t2">
          <div>
            <div class="label">Active Users</div>
            <div class="number">23,418<span class="unit"></span></div>
          </div>
          <div>
            <div class="change up">▲ +18.7% QoQ</div>
            <div class="spark">
              <span
                style="
                  height: 35%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 50%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 60%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 80%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 90%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 100%;
                  background: linear-gradient(
                    180deg,
                    #a78bfa 0%,
                    rgba(167, 139, 250, 0.2) 100%
                  );
                "
              ></span>
            </div>
          </div>
        </div>

        <div class="tile t3">
          <div>
            <div class="label">NRR</div>
            <div class="number">118<span class="unit">%</span></div>
          </div>
          <div>
            <div class="change up">▲ +4pt QoQ</div>
            <div class="spark">
              <span
                style="
                  height: 65%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 70%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 78%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 82%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 88%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 100%;
                  background: linear-gradient(
                    180deg,
                    #34d399 0%,
                    rgba(52, 211, 153, 0.2) 100%
                  );
                "
              ></span>
            </div>
          </div>
        </div>

        <div class="tile t4">
          <div>
            <div class="label">Churn Rate</div>
            <div class="number">2.1<span class="unit">%</span></div>
          </div>
          <div>
            <div class="change down">▼ -0.6pt QoQ</div>
            <div class="spark">
              <span
                style="
                  height: 100%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 90%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 78%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 72%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 60%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
              <span
                style="
                  height: 50%;
                  background: linear-gradient(
                    180deg,
                    #f87171 0%,
                    rgba(248, 113, 113, 0.2) 100%
                  );
                "
              ></span>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <span>Source: ProductOps Dashboard / FY2026 W37</span>
        <span>02 / 05</span>
      </footer>
    </div>
  </body>
</html>
