name: CI - skills

on:
  push:
    branches: ["main"]
    paths:
      - "skills/**"
      - "apps/website/public/llm.txt"
      - "scripts/**"
      - ".github/workflows/ci-skills.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "skills/**"
      - "apps/website/public/llm.txt"
      - "scripts/**"
      - ".github/workflows/ci-skills.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Upgrade gh CLI
        run: sudo apt-get update -qq && sudo apt-get install -y gh
      - name: Validate skills
        run: gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}

  check-skills-installable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test npx skills add
        run: |
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          npx -y skills@latest add "$GITHUB_WORKSPACE" --all
          test -f .agents/skills/pom-slide/SKILL.md
          test -f .agents/skills/pom-theme/SKILL.md

  check-skill-llm-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md llm.txt sync
        run: bash scripts/check-skill-llm-sync.sh
